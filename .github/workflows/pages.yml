name: Deploy project center
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://zwthys-cyber.github.io/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build public project and release catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py
      - name: Check JavaScript syntax and required site files
        run: |
          node --check _site/app.js
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/data/projects.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
